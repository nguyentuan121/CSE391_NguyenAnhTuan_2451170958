<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form đặt hàng</title>
  </head>
  <body>
    <h1>Checkout - Đặt hàng</h1>

    <!-- ================== PHẦN 1: GIỎ HÀNG ================== -->
    <h2>Giỏ hàng</h2>

    <table border="1" cellpadding="10" cellspacing="0">
      <thead>
        <tr>
          <th>STT</th>
          <th>Sản phẩm</th>
          <th>Đơn giá</th>
          <th>Số lượng</th>
          <th>Thành tiền</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>Điện thoại</td>
          <td>10.000.000đ</td>
          <td>1</td>
          <td>10.000.000đ</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Laptop</td>
          <td>20.000.000đ</td>
          <td>1</td>
          <td>20.000.000đ</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Tai nghe</td>
          <td>2.000.000đ</td>
          <td>2</td>
          <td>4.000.000đ</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="4"><strong>Tổng cộng</strong></td>
          <td><strong>34.000.000đ</strong></td>
        </tr>
      </tfoot>
    </table>

    <!-- ================== PHẦN 2: FORM THANH TOÁN ================== -->
    <h2>Thông tin thanh toán</h2>

    <form action="#" method="POST">
      <!-- Phương thức thanh toán -->
      <p>Phương thức thanh toán:</p>

      <input type="radio" id="cod" name="payment" value="cod" required />
      <label for="cod">COD (Thanh toán khi nhận hàng)</label><br />

      <input type="radio" id="bank" name="payment" value="bank" />
      <label for="bank">Chuyển khoản</label><br />

      <input type="radio" id="wallet" name="payment" value="wallet" />
      <label for="wallet">Ví điện tử</label><br /><br />

      <!-- Mã giảm giá -->
      <label for="coupon">Mã giảm giá:</label><br />
      <input
        type="text"
        id="coupon"
        name="coupon"
        placeholder="VD: SALE2026"
        pattern="^SALE[0-9]{4}$"
      /><br /><br />

      <!-- Ghi chú -->
      <label for="note">Ghi chú:</label><br />
      <textarea
        id="note"
        name="note"
        rows="3"
        placeholder="Ghi chú thêm (không bắt buộc)"
      ></textarea
      ><br /><br />

      <!-- ================== PHẦN 3: GIAO HÀNG ================== -->
      <h2>Thông tin giao hàng</h2>

      <!-- Ngày giao -->
      <label for="delivery-date">Ngày giao hàng:</label><br />
      <input
        type="date"
        id="delivery-date"
        name="delivery-date"
        min="2026-05-07"
        required
      /><br /><br />

      <!-- Khung giờ -->
      <label for="time-slot">Khung giờ:</label><br />
      <select id="time-slot" name="time-slot" required>
        <option value="">-- Chọn khung giờ --</option>
        <option value="morning">Sáng (8-12h)</option>
        <option value="afternoon">Chiều (14-18h)</option>
        <option value="evening">Tối (18-21h)</option></select
      ><br /><br />

      <!-- Range -->
      <label for="delivery-days">Thời gian giao hàng (ngày):</label><br />
      <input
        type="range"
        id="delivery-days"
        name="delivery-days"
        min="1"
        max="7"
        step="1"
      /><br /><br />

      <!-- Submit -->
      <button type="submit" aria-label="Xác nhận đặt hàng">
        Xác nhận đặt hàng
      </button>
    </form>
  </body>
</html>
