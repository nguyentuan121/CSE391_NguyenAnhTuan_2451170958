<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang Multimedia</title>
  </head>
  <body>
    <h1>Giới thiệu sản phẩm E-Commerce</h1>

    <!-- Hình ảnh sản phẩm -->
    <h2>Sản phẩm nổi bật</h2>

    <figure>
      <img
        src="/asset/iphone-15-plus-blue-thumb-ads.png"
        alt="Điện thoại iPhone 15 Plus"
        loading="lazy"
        style="max-width: 100%; height: auto"
      />
      <figcaption>Điện thoại iPhone 15 Plus</figcaption>
    </figure>

    <figure>
      <img
        src="/asset/HP Pavilion Aero 13-be2098AU.png"
        alt="Laptop mỏng nhẹ dành cho công việc"
        loading="lazy"
        style="max-width: 100%; height: auto"
      />
      <figcaption>Laptop mỏng nhẹ hiệu năng cao</figcaption>
    </figure>

    <figure>
      <img
        src="/asset/airpods-4-chong-on-chu-dong.webp"
        alt="Tai nghe không dây chống ồn"
        loading="lazy"
        style="max-width: 100%; height: auto"
      />
      <figcaption>Tai nghe Bluetooth chống ồn</figcaption>
    </figure>

    <!-- Video YouTube -->
    <h2>Nhạc chill (YouTube)</h2>
    <iframe
      width="966"
      height="543"
      src="https://www.youtube.com/embed/PGrglOD3yA0?list=RDPGrglOD3yA0"
      title="Playlist Nhạc Chill Này Là Để Giúp Cậu Tập Trung Học Bài Nhé #20 | Vừa Học Vừa Nghe Thì Đúng Bài"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <!-- Video local -->
    <h2>Video đồng hồ đếm ngược</h2>
    <video
      controls
      poster="/asset/iphone-15-plus-blue-thumb-ads.png"
      style="max-width: 100%"
    >
      <source
        src="/asset/ĐỒNG HỒ ĐẾM NGƯỢC 30s MP4 Phan Linh - YouTube.mp4"
        type="video/mp4"
      />
      <source
        src="/asset/ĐỒNG HỒ ĐẾM NGƯỢC 30s MP4 Phan Linh - YouTube.webm"
        type="video/webm"
      />
      Trình duyệt của bạn không hỗ trợ video.
    </video>

    <!-- Audio -->
    <h2>Nhạc remix</h2>
    <audio controls>
      <source src="/asset/VKCE.mp3" type="audio/mpeg" />
      Trình duyệt của bạn không hỗ trợ audio.
    </audio>
    <figure>
      <img
        src="/asset/513b342749aaeb2a1af012ee6e8cc9a7.jpg"
        alt="Ảnh PC đẹp "
        loading="lazy"
        style="max-width: 100%; height: auto"
      />
      <figcaption>Ảnh PC đẹp</figcaption>
    </figure>
    <!-- SVG logo -->
    <h2>Logo thương hiệu</h2>
    <svg width="100" height="100">
      <circle cx="50" cy="50" r="40" fill="blue" />
      <text x="50%" y="55%" text-anchor="middle" fill="white" font-size="20">
        Shop
      </text>
    </svg>
  </body>
</html>
