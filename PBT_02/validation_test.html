<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validation test</title>
  </head>
  <body>
    <form action="">
      <div>
        <!-- Trường hợp 1 -->
        <label for="text">Trường hợp 1</label>
        <input type="text" required value="" />
        <!-- User để trống -->
      </div>
      <br />
      <div>
        <!-- Trường hợp 2 -->
        <label for="email">Trường hợp 2</label>
        <input type="email" value="abc" />
        <!-- User gõ "abc" -->
      </div>
      <br />
      <div>
        <!-- Trường hợp 3 -->
        <label for="number">Trường hợp 3</label>
        <input type="number" min="1" max="10" value="15" />
        <!-- User gõ 15 -->
      </div>
      <br />
      <div>
        <!-- Trường hợp 4 -->
        <label for="text">Trường hợp 4</label>
        <input type="text" pattern="[0-9]{10}" value="abc123" />
        <!-- User gõ "abc123" -->
      </div>
      <br />
      <div>
        <!-- Trường hợp 5 -->
        <label for="password">Trường hợp 5</label>
        <input type="password" minlength="8" value="123" />
        <!-- User gõ "123" -->
      </div>
      <br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
