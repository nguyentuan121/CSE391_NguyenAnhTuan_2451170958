<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Model Lab</title>

    <link rel="stylesheet" href="boxmodel.css" />
  </head>
  <body>
    <h1>Phần 1 - Content Box vs Border Box</h1>

    <div class="box-container">
      <!-- Content Box -->
      <div class="box content-box">
        <h2>Content Box</h2>
        <p>
          width: 300px <br />
          padding: 20px <br />
          border: 5px
        </p>
      </div>

      <!-- Border Box -->
      <div class="box border-box">
        <h2>Border Box</h2>
        <p>
          width: 300px <br />
          padding: 20px <br />
          border: 5px
        </p>
      </div>
    </div>

    <hr />

    <h1>Phần 2 - Layout 3 cột</h1>

    <div class="layout-container">
      <div class="sidebar">
        <h2>Sidebar</h2>
        <p>Cột trái - 250px</p>
      </div>

      <div class="content">
        <h2>Content</h2>
        <p>Cột giữa - 500px</p>
      </div>

      <div class="ads">
        <h2>Ads</h2>
        <p>Cột phải - 250px</p>
      </div>
    </div>
  </body>
</html>
