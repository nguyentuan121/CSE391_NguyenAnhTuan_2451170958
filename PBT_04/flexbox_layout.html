<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Navigation & Cards</title>

    <link rel="stylesheet" href="flexbox.css" />
  </head>
  <body>
    <!-- ======================
         NAVBAR
    ======================= -->

    <header class="navbar">
      <div class="logo">MyStore</div>

      <nav class="menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>

      <div class="auth-buttons">
        <button class="login-btn">Login</button>
        <button class="register-btn">Register</button>
      </div>
    </header>

    <!-- ======================
         PRODUCTS SECTION
    ======================= -->

    <section class="products-section">
      <h1>Featured Products</h1>

      <div class="products-container">
        <!-- CARD 1 -->
        <div class="product-card">
          <img src="https://picsum.photos/300/200?random=1" alt="Product" />

          <div class="card-content">
            <h3>Gaming Keyboard</h3>
            <p class="price">1.200.000đ</p>

            <button>Mua</button>
          </div>
        </div>

        <!-- CARD 2 -->
        <div class="product-card">
          <img src="https://picsum.photos/300/200?random=2" alt="Product" />

          <div class="card-content">
            <h3>Wireless Mouse</h3>
            <p class="price">650.000đ</p>

            <button>Mua</button>
          </div>
        </div>

        <!-- CARD 3 -->
        <div class="product-card">
          <img src="https://picsum.photos/300/200?random=3" alt="Product" />

          <div class="card-content">
            <h3>Smart Watch</h3>
            <p class="price">2.300.000đ</p>

            <button>Mua</button>
          </div>
        </div>

        <!-- CARD 4 -->
        <div class="product-card">
          <img src="https://picsum.photos/300/200?random=4" alt="Product" />

          <div class="card-content">
            <h3>Bluetooth Speaker</h3>
            <p class="price">950.000đ</p>

            <button>Mua</button>
          </div>
        </div>

        <!-- CARD 5 -->
        <div class="product-card">
          <img src="https://picsum.photos/300/200?random=5" alt="Product" />

          <div class="card-content">
            <h3>Mechanical Keyboard</h3>
            <p class="price">1.800.000đ</p>

            <button>Mua</button>
          </div>
        </div>

        <!-- CARD 6 -->
        <div class="product-card">
          <img src="https://picsum.photos/300/200?random=6" alt="Product" />

          <div class="card-content">
            <h3>Gaming Headset</h3>
            <p class="price">1.100.000đ</p>

            <button>Mua</button>
          </div>
        </div>

        <!-- CARD 7 -->
        <div class="product-card">
          <img src="https://picsum.photos/300/200?random=7" alt="Product" />

          <div class="card-content">
            <h3>4K Monitor</h3>
            <p class="price">5.500.000đ</p>

            <button>Mua</button>
          </div>
        </div>

        <!-- CARD 8 -->
        <div class="product-card">
          <img src="https://picsum.photos/300/200?random=8" alt="Product" />

          <div class="card-content">
            <h3>Laptop Stand</h3>
            <p class="price">450.000đ</p>

            <button>Mua</button>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
