<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animations</title>
    <link rel="stylesheet" href="animations.css" />
  </head>
  <body>
    <header class="header">
      <h1>Product Animations</h1>
    </header>

    <!-- LOADING SPINNER -->
    <section class="spinner-section">
      <div class="spinner"></div>
    </section>

    <!-- PRODUCT GRID -->
    <section class="products">
      <!-- CARD 1 -->
      <div class="card fade-in">
        <div class="image-wrapper">
          <img src="https://picsum.photos/300/200?1" alt="" />
        </div>

        <div class="card-content">
          <h3>Gaming Headphone</h3>
          <p>$99</p>
          <button>Buy Now</button>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="card fade-in">
        <div class="image-wrapper">
          <img src="https://picsum.photos/300/200?2" alt="" />
        </div>

        <div class="card-content">
          <h3>Smart Watch</h3>
          <p>$120</p>
          <button>Buy Now</button>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="card fade-in">
        <div class="image-wrapper">
          <img src="https://picsum.photos/300/200?3" alt="" />
        </div>

        <div class="card-content">
          <h3>Wireless Speaker</h3>
          <p>$75</p>
          <button>Buy Now</button>
        </div>
      </div>

      <!-- CARD 4 -->
      <div class="card fade-in">
        <div class="image-wrapper">
          <img src="https://picsum.photos/300/200?4" alt="" />
        </div>

        <div class="card-content">
          <h3>Camera Lens</h3>
          <p>$250</p>
          <button>Buy Now</button>
        </div>
      </div>
    </section>
  </body>
</html>
