<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="logo">MyShop</div>

      <div class="hamburger">☰</div>

      <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="container">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h3>Filters</h3>

        <select>
          <option>Category</option>
          <option>Shoes</option>
          <option>Clothes</option>
          <option>Electronics</option>
        </select>

        <select>
          <option>Price</option>
          <option>$0 - $50</option>
          <option>$50 - $100</option>
        </select>
      </aside>

      <!-- PRODUCTS -->
      <main class="products">
        <!-- 8 PRODUCT CARDS -->

        <div class="card">
          <img src="https://picsum.photos/300/200?1" alt="" />
          <h3>Product 1</h3>
          <p>$29</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300/200?2" alt="" />
          <h3>Product 2</h3>
          <p>$35</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300/200?3" alt="" />
          <h3>Product 3</h3>
          <p>$45</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300/200?4" alt="" />
          <h3>Product 4</h3>
          <p>$50</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300/200?5" alt="" />
          <h3>Product 5</h3>
          <p>$22</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300/200?6" alt="" />
          <h3>Product 6</h3>
          <p>$60</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300/200?7" alt="" />
          <h3>Product 7</h3>
          <p>$80</p>
          <button>Buy Now</button>
        </div>

        <div class="card">
          <img src="https://picsum.photos/300/200?8" alt="" />
          <h3>Product 8</h3>
          <p>$99</p>
          <button>Buy Now</button>
        </div>
      </main>

      <!-- ADS -->
      <aside class="ads">
        <h3>Advertisement</h3>
        <div class="ad-box">Ads Here</div>
      </aside>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 2026 MyShop. All rights reserved.</p>
    </footer>
  </body>
</html>
