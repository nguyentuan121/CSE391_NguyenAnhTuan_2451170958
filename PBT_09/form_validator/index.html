<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validator</title>
    <link rel="stylesheet" href="/PBT_09/form_validator/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Form Đăng Ký</h1>

      <form id="registerForm">
        <label>Họ tên</label>
        <input type="text" id="name" />
        <small id="nameMessage"></small>

        <label>Email</label>
        <input type="email" id="email" />
        <small id="emailMessage"></small>

        <label>Password</label>
        <input type="password" id="password" />

        <div class="strength-bar">
          <div id="strengthFill"></div>
        </div>

        <small id="passwordMessage"></small>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" />
        <small id="confirmMessage"></small>

        <label>Phone</label>
        <input type="text" id="phone" />
        <small id="phoneMessage"></small>

        <button id="submitBtn" disabled>Đăng Ký</button>
      </form>
    </div>

    <div id="modal" class="modal">
      <div class="modal-content">
        <h2>Đăng ký thành công!</h2>

        <div id="result"></div>

        <button id="closeModal">Đóng</button>
      </div>
    </div>

    <script src="/PBT_09/form_validator/app.js"></script>
  </body>
</html>
